runtime: python312
entrypoint: gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app
instance_class: F2

# Credentials come from the App Engine default service account.
# Grant it the "Vertex AI User" role; no key file is needed.
env_variables:
  GOOGLE_CLOUD_PROJECT: "voicellapp"
  GOOGLE_CLOUD_LOCATION: "us-central1"
  GEMINI_MODEL: "gemini-2.5-flash"

handlers:
- url: /.*
  script: auto
  secure: always
